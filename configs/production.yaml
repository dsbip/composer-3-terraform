# ============================================================================
# Production Configuration — Single Environment
# Full-featured: Private IP, high resilience, CMEK, Cloud NAT, DAG processor,
# scheduled snapshots, metadata retention, Airflow UI IP allow-list.
# ============================================================================

project_id: "my-prod-project"
region: "us-central1"

labels:
  managed_by: terraform
  cost_center: "cc-1234"

environments:
  composer-prod:
    environment_size: "ENVIRONMENT_SIZE_LARGE"
    # HIGH_RESILIENCE requires exactly 2 schedulers, >= 2 workers, >= 2 DAG processors
    # and 0 or >= 2 triggerers (see workloads below).
    resilience_mode: "HIGH_RESILIENCE"

    # Private IP: Airflow components have no direct internet access; their traffic is
    # routed into the attached VPC (Cloud NAT below). Package builds keep internet access
    # so pypi_packages can be installed from PyPI.
    enable_private_environment: true
    enable_private_builds_only: false

    labels:
      env: production
      team: data-engineering

    network:
      name: "composer-prod-network"
      subnetwork_name: "composer-prod-subnet"
      subnetwork_cidr: "10.0.0.0/24"
      enable_cloud_nat: true
      tags:
        - "composer"
        - "production"

    service_account:
      roles:
        - "roles/composer.worker"
        - "roles/logging.logWriter"
        - "roles/monitoring.metricWriter"
        - "roles/storage.objectAdmin"
        - "roles/bigquery.dataEditor"
        - "roles/bigquery.jobUser"
        - "roles/dataflow.worker"
        - "roles/secretmanager.secretAccessor"

    software_config:
      # Pins the Airflow version; the newest build of it is picked at creation time.
      # For a fully reproducible environment pin a build instead, e.g.
      # composer-3-airflow-2.11.1-build.19 (list the available ones with
      # gcloud composer environments list-image-versions --location=us-central1).
      image_version: "composer-3-airflow-2.11.1"
      airflow_config_overrides:
        core-dags_are_paused_at_creation: "True"
        core-max_active_runs_per_dag: "5"
        celery-worker_concurrency: "16"
        webserver-expose_config: "False"
        webserver-dag_default_view: "grid"
        scheduler-dag_dir_list_interval: "60"
      env_variables:
        ENVIRONMENT: "production"
      pypi_packages:
        apache-airflow-providers-google: ">=10.0.0"
        apache-airflow-providers-cncf-kubernetes: ">=8.0.0"
        apache-airflow-providers-slack: ">=8.0.0"
        sentry-sdk: ">=1.0.0"
        pandas: ">=2.0.0"
        google-cloud-bigquery: ">=3.0.0"

    workloads:
      scheduler:
        cpu: 2 # Composer 3 schedulers take 0.5-2 vCPU
        memory_gb: 8
        storage_gb: 10
        count: 2
      web_server:
        cpu: 4
        memory_gb: 8
        storage_gb: 10
      worker:
        cpu: 4
        memory_gb: 16
        storage_gb: 10
        min_count: 3
        max_count: 12
      triggerer:
        cpu: 1
        memory_gb: 1
        count: 2
      dag_processor:
        cpu: 2
        memory_gb: 4
        storage_gb: 5
        count: 2

    # Only these source ranges can reach the Airflow UI.
    web_server_network_access_control:
      allowed_ip_ranges:
        - value: "203.0.113.0/24"
          description: "office-vpn"
        - value: "198.51.100.0/24"
          description: "cicd-runners"

    # 4 hours on Friday, Saturday and Sunday = the 12 hours/week Composer requires.
    maintenance_window:
      start_time: "2024-01-01T02:00:00Z"
      end_time: "2024-01-01T06:00:00Z"
      recurrence: "FREQ=WEEKLY;BYDAY=FR,SA,SU"

    encryption:
      enable_cmek: true
      kms_key_ring_name: "composer-prod-keyring"
      kms_key_name: "composer-prod-key"
      kms_key_rotation_period: "7776000s"

    recovery:
      enable_scheduled_snapshots: true
      # Existing bucket folder, writable by the environment's service account.
      snapshot_location: "gs://my-prod-project-composer-snapshots/composer-prod"
      snapshot_creation_schedule: "0 3 * * *"
      # Fixed UTC offset (US Central standard time); DST is not applied.
      time_zone: "UTC-06"

    data_retention:
      airflow_metadata_retention_config:
        retention_mode: "RETENTION_MODE_ENABLED"
        retention_days: 90
