# ============================================================================
# Multi-Environment Configuration
# Demonstrates deploying dev, staging, and prod Composer environments
# from a single YAML file. Global settings apply to all unless overridden.
# ============================================================================

project_id: "my-gcp-project"
region: "europe-west2"

labels:
  managed_by: terraform
  team: data-engineering

environments:

  # ── Dev: minimal, cost-optimised, Public IP ──────────────────────────
  composer-dev:
    labels:
      env: dev
    software_config:
      env_variables:
        ENVIRONMENT: "dev"

  # ── Staging: medium, Private IP + Cloud NAT, with triggerer ──────────
  composer-staging:
    environment_size: "ENVIRONMENT_SIZE_MEDIUM"
    enable_private_environment: true
    enable_private_builds_only: false # builds may reach PyPI

    labels:
      env: staging

    network:
      subnetwork_cidr: "10.10.0.0/24"
      enable_cloud_nat: true

    software_config:
      env_variables:
        ENVIRONMENT: "staging"
      pypi_packages:
        apache-airflow-providers-google: ">=10.0.0"

    workloads:
      scheduler:
        cpu: 1
        memory_gb: 4
        count: 2
      worker:
        cpu: 2
        memory_gb: 4
        min_count: 2
        max_count: 6
      triggerer:
        cpu: 0.5
        memory_gb: 1
        count: 1

    # 4 hours on Wednesday, Saturday and Sunday = 12 hours/week.
    maintenance_window:
      start_time: "2024-01-01T04:00:00Z"
      end_time: "2024-01-01T08:00:00Z"
      recurrence: "FREQ=WEEKLY;BYDAY=WE,SA,SU"

  # ── Prod: large, HA, Private IP, CMEK, full workloads ────────────────
  composer-prod:
    environment_size: "ENVIRONMENT_SIZE_LARGE"
    resilience_mode: "HIGH_RESILIENCE"
    enable_private_environment: true
    enable_private_builds_only: false

    labels:
      env: production

    network:
      subnetwork_cidr: "10.20.0.0/24"
      enable_cloud_nat: true
      tags:
        - "composer"
        - "production"

    service_account:
      roles:
        - "roles/composer.worker"
        - "roles/logging.logWriter"
        - "roles/monitoring.metricWriter"
        - "roles/storage.objectAdmin"
        - "roles/bigquery.dataEditor"
        - "roles/bigquery.jobUser"
        - "roles/secretmanager.secretAccessor"

    software_config:
      airflow_config_overrides:
        core-dags_are_paused_at_creation: "True"
        core-max_active_runs_per_dag: "5"
        celery-worker_concurrency: "16"
      env_variables:
        ENVIRONMENT: "production"
      pypi_packages:
        apache-airflow-providers-google: ">=10.0.0"
        apache-airflow-providers-slack: ">=8.0.0"
        pandas: ">=2.0.0"

    workloads:
      scheduler:
        cpu: 2 # Composer 3 schedulers take 0.5-2 vCPU
        memory_gb: 8
        storage_gb: 10
        count: 2
      web_server:
        cpu: 4
        memory_gb: 8
        storage_gb: 10
      worker:
        cpu: 4
        memory_gb: 16
        storage_gb: 10
        min_count: 3
        max_count: 12
      triggerer:
        cpu: 1
        memory_gb: 1
        count: 2
      dag_processor:
        cpu: 2
        memory_gb: 4
        storage_gb: 5
        count: 2

    encryption:
      enable_cmek: true
      kms_key_ring_name: "composer-prod-keyring"
      kms_key_name: "composer-prod-key"

    maintenance_window:
      start_time: "2024-01-01T02:00:00Z"
      end_time: "2024-01-01T06:00:00Z"
      recurrence: "FREQ=WEEKLY;BYDAY=FR,SA,SU"

    recovery:
      enable_scheduled_snapshots: true
      snapshot_location: "gs://my-gcp-project-composer-snapshots/composer-prod"
      snapshot_creation_schedule: "0 3 * * *"
      time_zone: "UTC"

    data_retention:
      airflow_metadata_retention_config:
        retention_mode: "RETENTION_MODE_ENABLED"
        retention_days: 90
