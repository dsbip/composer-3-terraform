# ============================================================================
# Private IP Configuration — Single Environment
# Composer 3 Private IP networking attached to a dedicated VPC with Cloud NAT,
# custom Composer internal range, Airflow UI IP allow-list, high resilience.
# ============================================================================

project_id: "my-secure-project"
region: "europe-west1"

labels:
  managed_by: terraform
  security: high

environments:
  composer-private:
    environment_size: "ENVIRONMENT_SIZE_MEDIUM"
    resilience_mode: "HIGH_RESILIENCE"

    # Private IP: Airflow components have no direct internet access. Their traffic is
    # routed into the attached VPC, where Cloud NAT (below) provides controlled egress.
    enable_private_environment: true
    # Keep internet access for package builds so pypi_packages can come from PyPI.
    # Set to true when packages come only from private repositories (e.g. Artifact Registry).
    enable_private_builds_only: false

    labels:
      env: staging
      team: platform

    network:
      subnetwork_cidr: "10.20.0.0/24"
      # /20 used by Composer's internal components. Must not overlap ranges your DAGs
      # need to reach (for example on-premises networks over VPN). Omit to use the default.
      composer_internal_ipv4_cidr_block: "100.64.128.0/20"
      enable_cloud_nat: true
      tags:
        - "composer"
        - "private"
        - "no-public-ip"

    software_config:
      airflow_config_overrides:
        core-dags_are_paused_at_creation: "True"
        webserver-expose_config: "False"
      env_variables:
        ENVIRONMENT: "staging"
      pypi_packages:
        apache-airflow-providers-google: ">=10.0.0"

    # HIGH_RESILIENCE: exactly 2 schedulers, >= 2 workers, >= 2 DAG processors,
    # 0 or >= 2 triggerers.
    workloads:
      scheduler:
        cpu: 2
        memory_gb: 4
        storage_gb: 5
        count: 2
      web_server:
        cpu: 2
        memory_gb: 4
        storage_gb: 5
      worker:
        cpu: 2
        memory_gb: 8
        storage_gb: 5
        min_count: 2
        max_count: 6
      triggerer:
        cpu: 0.5
        memory_gb: 1
        count: 2
      dag_processor:
        cpu: 1
        memory_gb: 2
        storage_gb: 2
        count: 2

    # The Airflow UI sees the public egress address of your network, so list public ranges.
    web_server_network_access_control:
      allowed_ip_ranges:
        - value: "203.0.113.0/24"
          description: "corporate-vpn-egress"
        - value: "198.51.100.10/32"
          description: "bastion-host"

    # 4 hours on Friday, Saturday and Sunday = the 12 hours/week Composer requires.
    maintenance_window:
      start_time: "2024-01-01T01:00:00Z"
      end_time: "2024-01-01T05:00:00Z"
      recurrence: "FREQ=WEEKLY;BYDAY=FR,SA,SU"

    recovery:
      enable_scheduled_snapshots: true
      # Existing bucket folder, writable by the environment's service account.
      snapshot_location: "gs://my-secure-project-composer-snapshots/composer-private"
      snapshot_creation_schedule: "0 2 * * *"
      time_zone: "UTC"
